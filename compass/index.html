<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PubVerse Compass</title>
  <link rel="icon" href="/assets/pubverse_mark.png">
  <link rel="canonical" href="https://pubverse.ai/">
  <meta name="robots" content="noindex">
  <!-- Compass moved onto the landing page as its first tab. This page stays so existing links
       and bookmarks keep working.

       The JS redirect runs first and carries the query string, which is what a shared link
       actually holds. The meta refresh is inside <noscript> ON PURPOSE: outside it, the browser
       schedules it during head parsing and it can win the race, and it drops the query. -->
  <script>
    (function () {
      try { location.replace('/' + (location.search || '') + (location.hash || '')); }
      catch (e) { location.href = '/'; }
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=/"></noscript>
  <style>
    body{margin:0;font-family:'Jost',-apple-system,'Segoe UI',system-ui,sans-serif;
         background:#faf9f7;color:#1f1e1d;display:flex;align-items:center;
         justify-content:center;min-height:100vh}
    a{color:#2f6db0}
  </style>
</head>
<body>
  <p>Compass now opens on the <a href="/">PubVerse home page</a>.</p>
</body>
</html>
