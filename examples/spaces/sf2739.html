    <script>/* Author layer for the field-map renderer: the pure half (validation, merging, node building).
 *
 * render_field_map.py inlines this file into the page as a plain script and the React app calls
 * window.PVAuthorLayer; tests/test_author_layer.js loads the same file under node. No DOM, no React,
 * no network here, so every rule below can be tested without a browser.
 *
 * TRUST MODEL. The parent page answers a reader's own query, so its messages are display data and
 * nothing else. Still every field is checked: ids must look like OpenAlex author ids, cluster keys must
 * exist on this map, counts are capped, text is cut to length and later rendered as TEXT (React
 * escapes it; nothing here or in the renderer uses innerHTML). Authors are display only: they never
 * reach a model feature or a training graph.
 *
 * PROTOCOL (documented in the wave contract, phase6/contract.md, "Deviations/M1 protocol"):
 *   parent -> map  pv:author-capable {version:1}      the parent can answer author messages
 *   parent -> map  pv:author-nodes   {mode:'place'|'expand', anchor, authors:[...], edges:[...]}
 *   parent -> map  pv:author-error   {message}
 *   map -> parent  pv:map-ready      {}               (announces the map; a parent may answer with capable)
 *   map -> parent  pv:author-query   {q}
 *   map -> parent  pv:author-click   {id}
 *   map -> parent  pv:open-author    {id}
 */
(function (root) {
  'use strict';

  var AUTHOR_ID_RE = /^A\d{1,12}$/;
  var ORCID_RE = /^\d{4}-\d{4}-\d{4}-\d{3}[\dX]$/;
  var MAX_PER_MESSAGE = 25;
  var MAX_TOTAL = 80;
  var MAX_CLUSTERS_PER_AUTHOR = 12;
  var MAX_EDGES_PER_MESSAGE = 200;
  var MAX_QUERY = 80;
  // A graph delivered whole by the parent (the --shell build) may carry the centre, its co-authors and its
  // context authors in one payload; the per-message and total caps are larger than for a name search.
  var MAX_GRAPH_AUTHORS = 121;
  var ROLES = { center: 1, coauthor: 1, context: 1 };

  function text(s, max) {
    if (s === null || s === undefined) return '';
    if (typeof s !== 'string' && typeof s !== 'number') return '';
    // control characters and bidi overrides out, whitespace collapsed
    var t = String(s).replace(/[\u0000-\u001f\u007f-\u009f‪-‮⁦-⁩]/g, ' ')
      .replace(/\s+/g, ' ').trim();
    return t.length > max ? t.slice(0, max - 1).replace(/\s+$/, '') + '…' : t;
  }

  function num(x, lo, hi) {
    if (typeof x !== 'number' || !isFinite(x)) return null;
    return Math.min(hi, Math.max(lo, x));
  }

  function cleanQuery(q) {
    // The string the map sends out when a reader asks for an author: what they typed, bounded.
    return text(q, MAX_QUERY);
  }

  function nodeId(aid) { return 'author::' + aid; }

  /* center | coauthor | context | '' . A person from a name search has no role; one delivered with a link
   * ('co' = co-author, 'space' = shares contexts) gets the role that link means. */
  function roleOf(a) {
    if (a && typeof a.role === 'string' && ROLES[a.role] === 1) return a.role;
    if (a && a.link === 'co') return 'coauthor';
    if (a && a.link === 'space') return 'context';
    return '';
  }

  /* Validate one inbound pv:author-nodes payload.
   * hasCluster(key) -> bool says whether a cluster node id exists on THIS map.
   * Returns {mode, anchor, authors, edges, dropped} or null when the message is unusable. */
  function validateAuthorNodes(d, hasCluster, opts) {
    if (!d || typeof d !== 'object') return null;
    var graph = !!(opts && opts.graph);
    var mode = d.mode === 'expand' ? 'expand' : (d.mode === 'place' ? 'place' : (graph && d.mode === 'graph' ? 'graph' : null));
    if (!mode) return null;
    if (!Array.isArray(d.authors)) return null;
    var dropped = 0;
    var seen = {};
    var authors = [];
    var perMessage = graph ? MAX_GRAPH_AUTHORS : MAX_PER_MESSAGE;
    for (var i = 0; i < d.authors.length && authors.length < perMessage; i++) {
      var a = d.authors[i];
      if (!a || typeof a !== 'object' || typeof a.id !== 'string' || !AUTHOR_ID_RE.test(a.id) || seen[a.id]) {
        dropped++; continue;
      }
      var name = text(a.name, 80);
      if (!name) { dropped++; continue; }
      seen[a.id] = true;
      var cl = [];
      var cs = Array.isArray(a.clusters) ? a.clusters : [];
      for (var j = 0; j < cs.length && cl.length < MAX_CLUSTERS_PER_AUTHOR; j++) {
        var c = cs[j];
        if (!c || typeof c.key !== 'string' || !hasCluster(c.key)) continue;
        var share = num(c.share, 0, 1);
        if (share === null) share = 0.3;
        var np = num(c.n_papers, 0, 1e6);
        cl.push({ key: c.key, share: share, n_papers: np === null ? null : Math.round(np) });
      }
      cl.sort(function (x, y) { return y.share - x.share; });
      // placing an author means putting it beside a topic of THIS map; with none valid there is nowhere to put it
      // (a graph payload may carry a person with no cluster on this space: the co-author ring only)
      if (mode === 'place' && !cl.length) { dropped++; continue; }
      var h = num(a.h_index, 0, 2000);
      var cred = num(a.credibility, 0, 1);
      var onMap = num(a.n_papers_on_map, 0, 1e6);
      authors.push({
        id: a.id, name: name,
        institution: text(a.institution, 100),
        h_index: h === null ? null : Math.round(h),
        orcid: (typeof a.orcid === 'string' && ORCID_RE.test(a.orcid)) ? a.orcid : '',
        credibility: cred,
        n_papers_on_map: onMap === null ? null : Math.round(onMap),
        reason: text(a.reason, 240),
        link: a.link === 'co' ? 'co' : (a.link === 'space' ? 'space' : ''),
        role: roleOf(a),
        shared_works: (num(a.shared_works, 0, 1e6) === null) ? null : Math.round(num(a.shared_works, 0, 1e6)),
        clusters: cl
      });
    }
    var edges = [];
    var es = Array.isArray(d.edges) ? d.edges : [];
    for (var k = 0; k < es.length && edges.length < MAX_EDGES_PER_MESSAGE; k++) {
      var e = es[k];
      if (!e || typeof e.source !== 'string' || typeof e.target !== 'string') continue;
      if (!AUTHOR_ID_RE.test(e.source) || !AUTHOR_ID_RE.test(e.target) || e.source === e.target) continue;
      var w = num(e.weight, 0, 1);
      edges.push({ source: e.source, target: e.target, kind: e.kind === 'space' ? 'space' : 'coauthor',
                   weight: w === null ? 0.5 : w });
    }
    var anchor = (typeof d.anchor === 'string' && AUTHOR_ID_RE.test(d.anchor)) ? d.anchor : '';
    if (!authors.length) return null;
    return { mode: mode, anchor: anchor, authors: authors, edges: edges, dropped: dropped };
  }

  /* Build the display nodes and edges for a validated message.
   *  existing: array of author nodes already on the map (state)
   *  byId:     lookup of cluster nodes (NODE_BY_ID)
   *  seq:      next sequence number (monotonic; the oldest unselected is evicted first)
   * Returns {nodes: [...new or refreshed author nodes], edges: [...], focusId}. */
  function buildAuthors(msg, existing, byId, seq) {
    var have = {};
    existing.forEach(function (n) { have[n.aid] = n; });
    var nodes = [], edges = [], s = seq;
    msg.authors.forEach(function (a) {
      var strongest = a.clusters.length ? byId[a.clusters[0].key] : null;
      var prev = have[a.id];
      var node = {
        id: nodeId(a.id), aid: a.id, type: 'author', subtype: 'author',
        label: a.name, title: a.name,
        institution: a.institution, h_index: a.h_index, orcid: a.orcid,
        credibility: a.credibility, n_papers_on_map: a.n_papers_on_map,
        clusters: a.clusters,
        anchor: strongest ? strongest.id : (prev ? prev.anchor : null),
        theme: strongest ? (strongest.theme || null) : (prev ? prev.theme : null),
        // a node with no cluster on this map hangs off the author that asked for it
        seedNear: ((msg.mode === 'expand' || (msg.mode === 'graph' && !strongest)) && msg.anchor && msg.anchor !== a.id)
          ? nodeId(msg.anchor)
          : (!strongest && prev ? prev.seedNear : null),
        reason: a.reason, link: a.link, role: a.role || (prev ? prev.role : '') || '',
        shared_works: a.shared_works,
        bfs_degree: 1, degree: a.clusters.length + 1,
        seq: prev ? prev.seq : s++
      };
      nodes.push(node);
      a.clusters.forEach(function (c) {
        edges.push({ source: node.id, target: c.key, weight: c.share, w_rel: Math.max(0.15, c.share),
                     edge_type: 'author_member' });
      });
    });
    var ids = {};
    existing.concat(nodes).forEach(function (n) { ids[n.aid] = true; });
    var linked = {};
    msg.edges.forEach(function (e) {
      if (!ids[e.source] || !ids[e.target]) return;
      var key = [e.source, e.target].sort().join('|');
      linked[key] = true;

   * Returns {nodes, evicted: [node ids]}. */
  function mergeAuthors(existing, fresh, selectedId, max) {

          .sort(function (a, b) { return b.seq - a.seq; }).slice(0, list.length - max);

   * The published map carries a top-K author list per cluster so an anonymous reader can find and place
   * authors with no parent page. It feeds the SAME validateAuthorNodes/buildAuthors path as a parent's
   * pv:author-nodes message: these functions only turn the index into that message shape. */
  var MAX_EMB_PLACE = 5;
  var MAX_EMB_NEIGHBORS = 12;

    if (!emb || typeof emb !== 'object' || emb.v !== 1 || !Array.isArray(emb.authors) || !emb.authors.length) return null;
    var idToIdx = {};
    emb.authors.forEach(function (a, i) { if (a && typeof a.id === 'string') idToIdx[a.id] = i; });

  /* Author indices whose name matches q: every query token must match; the LAST token may be a prefix.
   * Order = credibility (the index is stored credibility-descending, so ascending index). */
  function searchEmbedded(E, q, limit) {
    if (!E) return [];
    var toks = fold(cleanQuery(q));
    if (!toks.length) return [];
    var sets = [];

      var last = i === toks.length - 1, hit = {}, any = false;
      var add = function (list) {
        if (!Array.isArray(list)) return;
        for (var j = 0; j < list.length; j++) { hit[list[j]] = true; any = true; }
      };
      if (Object.prototype.hasOwnProperty.call(E.names, toks[i])) add(E.names[toks[i]]);
      if (last) {
        for (var k = 0; k < E.keys.length; k++) {
          if (E.keys[k].length > toks[i].length && E.keys[k].lastIndexOf(toks[i], 0) === 0) add(E.names[E.keys[k]]);

  function embKey(E, ref) {
    if (typeof ref === 'number') return (E.emb.clusters && E.emb.clusters[ref]) || '';
    return typeof ref === 'string' ? ref : '';

  function embReason(r) {

      id: a.id, name: a.n, institution: a.i || '', country: a.c || '',
      h_index: a.h, orcid: a.o || '', credibility: typeof a.cr === 'number' ? a.cr / 100 : null,
      n_papers_on_map: a.p,
      clusters: (a.cl || []).map(function (c) { return { key: embKey(E, c[0]), share: c[1] }; })

  function embeddedPlace(E, idxs) {
    if (!E || !idxs.length) return null;
    return { type: 'pv:author-nodes', mode: 'place', anchor: E.emb.authors[idxs[0]].id,
             authors: idxs.slice(0, MAX_EMB_PLACE).map(function (i) { return embRecord(E, i); }), edges: [] };

  /* pv:author-nodes (expand) for a click on author `id`: its embedded deepthinkers (co-authors first)
   * with the clusters they share with it, and a weighted edge to each embedded co-author. */
  function embeddedExpand(E, id) {
    if (!E || !Object.prototype.hasOwnProperty.call(E.idToIdx, id)) return null;
    var ai = E.idToIdx[id], a = E.emb.authors[ai];
    var mine = {};
    (a.cl || []).forEach(function (c) { mine[embKey(E, c[0])] = true; });
    var shared = {};
    (a.co || []).forEach(function (c) { shared[c[0]] = c[1]; });

    Object.keys(shared).forEach(function (k) { if (shared[k] > maxShared) maxShared = shared[k]; });

    seen[ai] = true;
    (a.dt || []).forEach(function (d) {
      if (authors.length > MAX_EMB_NEIGHBORS) return;
      var bi = d[0];
      if (typeof bi !== 'number' || !E.emb.authors[bi] || seen[bi]) return;
      seen[bi] = true;
      var b = E.emb.authors[bi];
      var reason = embReason(d[1]);
      var isCo = reason === 'co-author';
      var common = (b.cl || []).filter(function (c) { return mine[embKey(E, c[0])]; });
      var rec = embRecord(E, bi, { reason: reason, link: isCo ? 'co' : 'space' });
      if (common.length) rec.clusters = common.map(function (c) { return { key: embKey(E, c[0]), share: c[1] }; });
      authors.push(rec);
      if (isCo) edges.push({ source: a.id, target: b.id, kind: 'coauthor',
                             weight: Math.max(0.2, (shared[bi] || 1) / maxShared) });

  }


  /* ---- Whole-graph payload (the --shell build) ----
   * The shell page mounts only after its parent posts pv:graph {nodes, edges, metadata}. This validates it
   * and splits it: map nodes/edges (themes, topics, papers) go to the renderer as they are, people become an
   * author message (mode 'graph') that goes through the same validateAuthorNodes/buildAuthors path as every
   * other author. Person node: {id:'A123'|'author::A123', type:'author', role:'center'|'coauthor'|'context',

   * reason, clusters?:[{key, share, n_papers}]}. Edges touching a person: author->cluster = membership (weight =
   * share, unless the node lists its clusters), author->author = link (kind 'coauthor' | else context).

   * dangling edges (dropped and counted). */
  var MAX_GRAPH_NODES = 4000;
  var MAX_GRAPH_EDGES = 40000;

  var AUTHOR_NODE_RE = /^(?:author::)?(A\d{1,12})$/;

  var URL_KEYS = { url: 1, link: 1, href: 1, doi_url: 1, source_url: 1 };

        out[k] = cleanValue(v[k], depth + 1, k); n++;

    if (!Array.isArray(p.nodes) || !p.nodes.length) return fail('nodes must be a non-empty array');
    if (p.nodes.length > MAX_GRAPH_NODES) return fail('too many nodes (' + p.nodes.length + ' > ' + MAX_GRAPH_NODES + ')');
    var rawEdges = p.edges === undefined ? [] : p.edges;
    if (!Array.isArray(rawEdges)) return fail('edges must be an array');
    if (rawEdges.length > MAX_GRAPH_EDGES) return fail('too many edges');
    if (p.metadata !== undefined && !isPlain(p.metadata)) return fail('metadata must be an object');
    var ids = {}, mapNodes = [], people = [], centers = 0, byId = {};
    for (var i = 0; i < p.nodes.length; i++) {
      var n = p.nodes[i];
      if (!isPlain(n)) return fail('node ' + i + ' is not an object');
      if (typeof n.id !== 'string' || !n.id || n.id.length > 200 || /[\u0000-\u001f]/.test(n.id)) return fail('node ' + i + ' has no usable id');
      if (typeof n.type !== 'string' || !GRAPH_TYPES[n.type]) return fail('node ' + n.id.slice(0, 40) + ' has an unknown type');
      if (ids[n.id]) return fail('duplicate node id ' + n.id.slice(0, 40));
      ids[n.id] = true;
      if (n.type === 'author') {
        var m = AUTHOR_NODE_RE.exec(n.id);
        if (!m) return fail('author node id must look like A123: ' + n.id.slice(0, 40));
        if (n.role !== undefined && !(typeof n.role === 'string' && ROLES[n.role] === 1)) return fail('author ' + m[1] + ' has an unknown role');
        if (n.role === 'center') centers++;
        people.push({ raw: n, aid: m[1] });
      } else {
        var c = cleanValue(n, 0, null);
        mapNodes.push(c); byId[c.id] = c;
      }
    }
    if (centers > 1) return fail('more than one centre author');
    // people: aid -> record
    var peopleBy = {}, order = [];
    people.forEach(function (pp) { peopleBy[pp.aid] = pp; });
    var memberOf = {}, links = [], edges = [], droppedEdges = 0;
    for (var j = 0; j < rawEdges.length; j++) {
      var e = rawEdges[j];
      if (!isPlain(e) || typeof e.source !== 'string' || typeof e.target !== 'string') return fail('edge ' + j + ' has no source/target');
      var ms = AUTHOR_NODE_RE.exec(e.source), mt = AUTHOR_NODE_RE.exec(e.target);
      var sPerson = ms && peopleBy[ms[1]] ? ms[1] : null, tPerson = mt && peopleBy[mt[1]] ? mt[1] : null;
      var w = num(e.weight, 0, 1e6);
      if (sPerson && tPerson) {
        if (sPerson === tPerson) { droppedEdges++; continue; }
        var kind = /co.?author/i.test(String(e.kind || e.edge_type || '')) ? 'coauthor' : 'space';
        links.push({ source: sPerson, target: tPerson, kind: kind, weight: w === null ? 0.5 : Math.min(1, w) });
      } else if (sPerson || tPerson) {
        var aid = sPerson || tPerson, other = sPerson ? e.target : e.source;

      } else if (memberOf[pp.aid]) {
        cl = memberOf[pp.aid];
      }

      if (cred !== null && cred > 1) cred = cred / 100;
      var rec = {
        id: pp.aid, name: n.name !== undefined ? n.name : n.label, institution: n.institution, h_index: n.h_index,
        orcid: n.orcid, credibility: cred, n_papers_on_map: n.n_papers_on_map, reason: n.reason,
        role: n.role, shared_works: n.shared_works, clusters: cl

        return !!byId[k] && byId[k].type === 'cluster';
      }, { graph: true });

      // validateAuthorNodes keeps the first MAX_GRAPH_AUTHORS; the centre is first by construction
      if (anchor && msg.authors.every(function (a) { return a.id !== anchor; })) return fail('the centre author has no name');
      msg.anchor = anchor;
    }
    return { ok: true, nodes: mapNodes, edges: edges, metadata: meta, authorMsg: msg,
             dropped: { edges: droppedEdges, people: msg ? msg.dropped : 0 } };
  }

  /* ---- Search rows ----
   * Real matches first (themes, topics, papers, then people already on the map), the one "Find author"
   * row last. Typing a topic name and choosing it must select the topic; only the last row asks for authors. */
  var TYPE_ORDER = { theme: 0, input_article: 1, cluster: 2, paper: 3, subtheme: 4 };
  function searchRows(nodes, authorNodes, query, canFind) {

      if (String(query).trim().length >= 3) rows.push({ id: '__find_author__', type: 'find_author', label: cleanQuery(query) });

  var api = {
    AUTHOR_ID_RE: AUTHOR_ID_RE, MAX_PER_MESSAGE: MAX_PER_MESSAGE, MAX_TOTAL: MAX_TOTAL,

    validateAuthorNodes: validateAuthorNodes, buildAuthors: buildAuthors,
    mergeAuthors: mergeAuthors, pruneEdges: pruneEdges,
    fold: fold, prepareEmbedded: prepareEmbedded, searchEmbedded: searchEmbedded,
    embeddedPlace: embeddedPlace, embeddedExpand: embeddedExpand,
    validateGraph: validateGraph, searchRows: searchRows, roleOf: roleOf, MAX_GRAPH_AUTHORS: MAX_GRAPH_AUTHORS
  };

})(typeof window !== 'undefined' ? window : this);
